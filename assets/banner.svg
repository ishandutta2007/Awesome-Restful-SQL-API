<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .conn-line {
        stroke: url(#glowGrad);
        stroke-width: 2;
        stroke-dasharray: 8 6;
        animation: dash 12s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-pulse-delayed {
        animation: pulse 3s ease-in-out infinite alternate;
        animation-delay: 1.5s;
      }
      .float-badge {
        animation: float 5s ease-in-out infinite alternate;
      }
      .float-badge-delayed {
        animation: float 6s ease-in-out infinite alternate;
        animation-delay: 2.5s;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.4; }
        100% { r: 10px; opacity: 0.95; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .tag-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g class="bg-grid">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Dynamic Data Stream / Flow Path (Background Layer) -->
  <g opacity="0.6">
    <path class="conn-line" d="M 50,70 Q 250,20 450,80 T 850,50 T 1150,90" fill="none" />
    <path class="conn-line" d="M 60,310 Q 320,340 600,290 T 980,320 T 1140,280" fill="none" style="animation-duration: 9s;" />
  </g>

  <!-- Floating Dynamic Tech Cards / Pills in Upper and Lower Margins (Never overlapping center) -->
  <g class="float-badge" transform="translate(60, 42)">
    <rect width="180" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <circle cx="22" cy="17" r="5" fill="#38bdf8" class="node-pulse" />
    <text x="36" y="22" class="pill-text">⚡ Instant REST CRUD</text>
  </g>

  <g class="float-badge-delayed" transform="translate(950, 42)">
    <rect width="190" height="34" rx="17" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <circle cx="22" cy="17" r="5" fill="#818cf8" class="node-pulse-delayed" />
    <text x="36" y="22" class="pill-text">🔒 Database RLS &amp; RBAC</text>
  </g>

  <g class="float-badge-delayed" transform="translate(70, 285)">
    <rect width="190" height="34" rx="17" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <circle cx="22" cy="17" r="5" fill="#c084fc" class="node-pulse" />
    <text x="36" y="22" class="pill-text">🤖 Schema Introspection</text>
  </g>

  <g class="float-badge" transform="translate(940, 285)">
    <rect width="200" height="34" rx="17" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <circle cx="22" cy="17" r="5" fill="#34d399" class="node-pulse-delayed" />
    <text x="36" y="22" class="pill-text">🌐 Zero-Code SQL Gateway</text>
  </g>

  <!-- Central Foreground Content (Title, Tag, Subtitle) - High z-index with drop shadow -->
  <g filter="url(#shadow)" transform="translate(600, 120)" text-anchor="middle">
    <!-- Category Mini-Tag -->
    <rect x="-140" y="-12" width="280" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text x="0" y="5" text-anchor="middle" class="tag-text">POSTGRES • MYSQL • SQLITE • CLOUD</text>

    <!-- Main Title -->
    <text x="0" y="55" class="title">Awesome RESTful SQL API</text>

    <!-- Decorative Gradient Underline -->
    <rect x="-180" y="72" width="360" height="3.5" rx="2" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.9" />

    <!-- Subtitle -->
    <text x="0" y="108" class="subtitle">Turn Relational Databases into Secure, High-Performance RESTful APIs Automatically</text>
  </g>

  <!-- Glowing Corner Lights -->
  <circle cx="10" cy="10" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1190" cy="350" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow)" />
</svg>
